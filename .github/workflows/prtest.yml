name: PR-CI

# The merge gate. Everything here has to stay fast and reliable, because it runs on
# every push to every pull request. The longer E2E suites live in nightly.yml.

on:
  pull_request:

jobs:
  buildWithSubmodule:
    name: Run Unit Test
    runs-on: macos-latest
    strategy:
      matrix:
        node: [20]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2.0.10
    - name: Run script
      run: |
        # Add your script commands here
        npm install --no-package-lock
        npm run bundle
    - name: Run Unit Test
      run: |
        # Add your script commands here
        npm test
    - name: Run Dashboard Unit Test
      # `npm run bundle` above already installed dashboard-frontend's dependencies
      # via buildAndCopyWeb.sh, so this only runs the suite.
      run: npm test --prefix dashboard-frontend
    - name: Run lint
      run: |
        npm run prettier-check

  AndroidIntegrationTest:
    name: Run Android Integration Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [29]
        target: [google_apis]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Build
        run: |
         npm install --no-package-lock
         npm run bundle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 6
          script: npm run integration-android

  IOSIntegrationTest:
    name: Run iOS Integration Test
    runs-on: macos-latest
    strategy:
      matrix:
        node: [ 20 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build
        run: |
          npm install --no-package-lock
          npm run bundle
      - name: Run iOS Integration Test
        run: |
          npm run integration-ios
