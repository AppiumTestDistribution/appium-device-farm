name: Release

on:
   workflow_dispatch:
   push:
      branches: [ main ]
      
jobs:
   build:
      runs-on: macos-latest
      steps:
         - uses: actions/checkout@v6
           with:
             # Keep PAT_TOKEN. checkout persists these credentials, and @semantic-release/git
             # reuses them to push the version bump and tag back to main - the default
             # GITHUB_TOKEN is not enough for that. `submodules: recursive` was dropped:
             # .gitmodules was removed in 6367a60, so there is nothing left to recurse into.
             token: ${{ secrets.PAT_TOKEN }}
         - uses: actions/setup-node@v3
           with:
              node-version: lts/*
              check-latest: true
         - run: npm install --no-package-lock
           name: Install dependencies
         - run: npm run bundle
           name: Build
         - run: npx semantic-release
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              NPM_TOKEN: ${{ secrets.npm_token }}
           name: Release
